<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rain radar">
<title>Rain radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #0e1a2b;
    --ink-2: #16273d;
    --text: #e9f1fa;
    --muted: #93a8c2;
    --rain: #3aa7ff;
    --line: #2a3f58;
    --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    background: var(--ink);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
  }

  /* Karte */
  .stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #map { position: absolute; inset: 0; background: #cfd8e3; }
  .map-actions {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px;
    max-width: calc(100% - 72px);
    z-index: 1000; display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    appearance: none; border: 0; cursor: pointer;
    min-height: 40px; padding: 0 14px;
    background: #fff; color: var(--ink);
    font: 600 0.9rem/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    border-radius: 10px; box-shadow: 0 1px 6px rgba(0, 0, 0, .35);
  }
  .chip:active { background: #e3ecf6; }
  select.chip { padding: 0 8px; }

  /* Panel unten */
  .panel {
    flex: 0 0 auto;
    background: var(--ink);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .wx { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .place { margin: 0; font-size: 1.3rem; font-weight: 650; line-height: 1.2; overflow-wrap: anywhere; }
  .desc { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
  .temp { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .temp .icon { font-size: 2rem; line-height: 1; }
  .temp .deg { font-size: 2.6rem; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin: 14px 0 6px; padding: 10px 0;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .stats div { min-width: 0; }
  .stats dt { color: var(--muted); font-size: 0.75rem; margin: 0 0 2px; }
  .stats dd { margin: 0; font-size: 0.95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Player */
  .player { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .play {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%;
    border: 0; cursor: pointer; background: var(--rain); color: var(--ink);
    display: grid; place-items: center;
  }
  .play:disabled { background: var(--ink-2); color: var(--muted); cursor: default; }
  .play svg { width: 24px; height: 24px; fill: currentColor; }
  .scrub { flex: 1 1 auto; min-width: 0; }
  .times { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; margin-top: 2px; }
  .times .rel { color: var(--muted); margin-left: 6px; }
  .times .progress { color: var(--warn); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 40px; margin: 0; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--rain) var(--pct, 0%), var(--line) var(--pct, 0%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px;
    border-radius: 50%; background: #fff; border: 3px solid var(--rain);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--rain); }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--rain);
  }
  :is(button, select, input[type=range]):focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .status { margin: 8px 0 0; min-height: 1.2em; font-size: 0.85rem; color: var(--warn); }

  .leaflet-container { font-family: inherit; }

  @media (max-width: 380px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="stage">
  <div id="map" data-i18n-label="mapLabel"></div>
  <div class="map-actions">
    <button class="chip" id="btnLocate" type="button" data-i18n="locate"></button>
    <button class="chip" id="btnRefresh" type="button" data-i18n="refresh"></button>
    <select class="chip" id="lang" aria-label="Language">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="pt-BR">Português (Brasil)</option>
    </select>
  </div>
</div>

<section class="panel" data-i18n-label="panelLabel">
  <div class="wx">
    <div>
      <h1 class="place" id="place"></h1>
      <p class="desc" id="desc">&nbsp;</p>
    </div>
    <div class="temp">
      <span class="icon" id="icon" aria-hidden="true"></span>
      <span class="deg" id="temp">–</span>
    </div>
  </div>

  <dl class="stats">
    <div><dt data-i18n="feels"></dt><dd id="sFeel">–</dd></div>
    <div><dt data-i18n="wind"></dt><dd id="sWind">–</dd></div>
    <div><dt data-i18n="humidity"></dt><dd id="sHum">–</dd></div>
    <div><dt data-i18n="precip"></dt><dd id="sRain">–</dd></div>
  </dl>

  <div class="player">
    <button class="play" id="play" type="button" disabled></button>
    <div class="scrub">
      <input id="slider" type="range" min="0" max="0" step="1" value="0" disabled data-i18n-label="sliderLabel">
      <div class="times">
        <span><strong id="tLabel">–</strong><span class="rel" id="tRel"></span></span>
        <span class="progress" id="tProgress"></span>
      </div>
    </div>
  </div>

  <p class="status" id="status" role="status"></p>
</section>

let lang = FALLBACK_LANG;

/* Übersetzung mit Platzhaltern wie {n}; fehlt ein Text, greift Englisch */
function t(key, vars) {
  let s = LANGS[lang].s[key] ?? LANGS[FALLBACK_LANG].s[key] ?? key;
  if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
}

/* Sprache des Geräts ermitteln; bei unbekannter oder nicht unterstützter Sprache: Englisch */
function detectLang() {
  const prefs = (navigator.languages && navigator.languages.length)
    ? navigator.languages
    : [navigator.language || navigator.userLanguage || ""];
  for (const raw of prefs) {
    const code = String(raw || "").toLowerCase();
    if (code.startsWith("de")) return "de";
    if (code.startsWith("en")) return "en";
    if (code.startsWith("es")) return "es";
    if (code.startsWith("fr")) return "fr";
    if (code.startsWith("pt")) return "pt-BR";
  }
  return FALLBACK_LANG;
}

function savedLang() {
  try {
    const v = localStorage.getItem("regenradar.lang");
    return v && LANGS[v] ? v : null;
  } catch (e) { return null; }   // z. B. privater Modus
}

function saveLang(code) {
  try { localStorage.setItem("regenradar.lang", code); } catch (e) { /* nicht schlimm */ }
}

------------------------------------------------------------------ */

const LAST_FRAME_MS   = 1600;   // Pause beim neuesten Bild vor dem Neustart
const MAX_REQ_PER_MIN = 80;     // RainViewer erlaubt 100 Anfragen pro IP und Minute
const REFRESH_MS      = 5 * 60 * 1000;
const START_VIEW      = [51.16, 10.45];  // Deutschland, bis der Standort bekannt ist
const START_ZOOM      = 6;
const LOCAL_ZOOM      = 7;     // RainViewer liefert höchstens bis Zoom 7 echte Daten

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* Statusmeldung und Ortsname werden als Schlüssel gemerkt, damit sie
   beim Sprachwechsel neu übersetzt werden können */
let statusState = null;
function setStatus(key, vars) {
  statusState = key ? { key, vars } : null;
  renderStatus();
}
function renderStatus() {
  $("status").textContent = statusState ? t(statusState.key, statusState.vars) : "";
}

let placeState = { key: "locating" };
function renderPlace() {
  $("place").textContent = placeState.text !== undefined ? placeState.text : t(placeState.key);
}

async function getJson(url, ms = 10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ------------------------------------------------------------------
   Karte
------------------------------------------------------------------ */
const map = L.map("map", { zoomControl: false, minZoom: 4, maxZoom: 10 })
  .setView(START_VIEW, START_ZOOM);
L.control.zoom({ position: "topright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
}).addTo(map);

let pos = null;
let marker = null;

function drawMarker() {
  if (marker) marker.remove();
  marker = L.circleMarker([pos.lat, pos.lon], {
    radius: 8, color: "#fff", weight: 3, fillColor: "#e5484d", fillOpacity: 1
  }).addTo(map);
}

------------------------------------------------------------------ */

function recentRequests() {
  const cut = Date.now() - 60000;
  reqLog = reqLog.filter((x) => x > cut);
  return reqLog.length;
}

function makeLayer(i) {
  if (layers[i]) return layers[i];
  // 512er-Kacheln: viermal weniger Anfragen als bei 256er-Kacheln
  const layer = L.tileLayer(host + frames[i].path + "/512/{z}/{x}/{y}/2/1_1.png", {
    tileSize: 512,
    zoomOffset: -1,
    maxNativeZoom: 7,
    maxZoom: 10,
    opacity: 0,
    keepBuffer: 1,
    attribution: 'Radar: <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>'
  });
  layer.on("tileloadstart", () => { reqTotal++; reqLog.push(Date.now()); });
  layer.on("tileerror", () => setStatus("tileError"));
  layer.on("load", () => { ready.add(i); updateUi(); });
  layer.addTo(map);
  layers[i] = layer;
  return layer;
}

function fmtTime(sec) {
  const s = new Date(sec * 1000).toLocaleTimeString(LANGS[lang].locale, { hour: "2-digit", minute: "2-digit" });
  return t("clock", { t: s });
}

function fmtRel(sec) {
  const min = Math.round((Date.now() / 1000 - sec) / 60);
  if (Math.abs(min) < 3) return t("now");
  return min > 0 ? t("ago", { n: min }) : t("inMin", { n: -min });
}

function updateUi() {
  playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  const label = t(playing ? "pause" : "play");
  playBtn.setAttribute("aria-label", label);
  playBtn.title = label;
  if (!frames.length) return;
  const f = frames[current];
  slider.value = current;
  slider.style.setProperty("--pct", frames.length > 1 ? (current / (frames.length - 1)) * 100 + "%" : "100%");
  $("tLabel").textContent = fmtTime(f.time);
  $("tRel").textContent = fmtRel(f.time);
  const all = ready.size >= frames.length;
  $("tProgress").textContent = all ? "" : t("loading", { n: Math.min(ready.size, frames.length), total: frames.length });
  playBtn.disabled = !all;
}

function show(i) {
  makeLayer(i);
  layers.forEach((l, k) => { if (l) l.setOpacity(k === i ? RADAR_OPACITY : 0); });
  current = i;
  updateUi();
}

/* Wiedergabe */
function stop() {
  playing = false;
  clearTimeout(playTimer);
  updateUi();
}

function schedule() {
  clearTimeout(playTimer);
  const delay = current === frames.length - 1 ? LAST_FRAME_MS : FRAME_MS;
  playTimer = setTimeout(() => {
    if (!playing) return;
    show((current + 1) % frames.length);
    schedule();
  }, delay);
}

function play() {
  if (ready.size < frames.length) return;
  playing = true;
  if (current >= frames.length - 1) show(0);
  updateUi();
  schedule();
}

playBtn.addEventListener("click", () => (playing ? stop() : play()));

slider.addEventListener("input", () => {
  stop();
  show(Number(slider.value));
});

/* Restliche Bilder im Hintergrund nachladen, ohne das Anfragelimit zu sprengen */
function schedulePreload(delay) {
  clearTimeout(preloadTimer);
  preloadTimer = setTimeout(preload, delay);
}

async function preload() {
  const id = ++preloadId;
  const order = [...frames.keys()].reverse();      // neueste zuerst
  for (const i of order) {
    if (id !== preloadId) return;
    if (layers[i]) continue;
    while (recentRequests() + perLayer > MAX_REQ_PER_MIN) {
      await sleep(1000);
      if (id !== preloadId) return;
    }
    const n0 = reqTotal;
    makeLayer(i);
    const t0 = Date.now();
    while (!ready.has(i) && Date.now() - t0 < 10000) {
      await sleep(150);
      if (id !== preloadId) return;
    }
    ready.add(i);
    perLayer = Math.max(perLayer, reqTotal - n0);
    updateUi();
  }
}

/* Beim Verschieben/Zoomen nur das aktuelle Bild behalten (spart Anfragen) */
map.on("movestart", () => {
  stop();
  preloadId++;
  clearTimeout(preloadTimer);
  layers.forEach((l, k) => {
    if (l && k !== current) { map.removeLayer(l); layers[k] = null; }
  });
  ready = new Set(ready.has(current) ? [current] : []);
  updateUi();
});
map.on("moveend", () => { if (frames.length) schedulePreload(500); });

async function loadRadar(force) {
  let data;
  try {
    data = await getJson(RADAR_INDEX);
  } catch (e) {
    setStatus("radarFail");
    return;
  }
  const list = [...(data.radar?.past ?? []), ...(data.radar?.nowcast ?? [])];
  if (!list.length) { setStatus("radarNone"); return; }

  const newest = list[list.length - 1].time;
  if (!force && frames.length && frames[frames.length - 1].time === newest) { updateUi(); return; }

  stop();
  preloadId++;
  layers.forEach((l) => l && map.removeLayer(l));
  layers = [];
  ready = new Set();
  host = data.host;
  frames = list.map((f) => ({ time: f.time, path: f.path }));
  slider.max = frames.length - 1;
  slider.disabled = false;
  setStatus(null);
  show(frames.length - 1);
  schedulePreload(1200);
}

/* ------------------------------------------------------------------
   Standort
------------------------------------------------------------------ */
function locate() {
  setStatus(null);
  placeState = { key: "locating" };
  renderPlace();
  if (!("geolocation" in navigator)) {
    placeState = { key: "noLocation" };
    renderPlace();
    setStatus("geoUnsupported");
    return;
  }
  navigator.geolocation.getCurrentPosition(onPosition, onPositionError, {
    enableHighAccuracy: false, timeout: 15000, maximumAge: 60000
  });
}

function onPosition(p) {
  pos = { lat: p.coords.latitude, lon: p.coords.longitude };
  drawMarker();
  map.setView([pos.lat, pos.lon], LOCAL_ZOOM);
  loadPlace();
  loadWeather();
}

function onPositionError(err) {
  placeState = { key: "noLocation" };
  renderPlace();
  const keys = { 1: "geoDenied", 2: "geoUnavailable", 3: "geoTimeout" };
  setStatus(keys[err.code] || "geoFailed");
}

/* Ortsname: erst Nominatim (OpenStreetMap), sonst BigDataCloud */
let placeRequest = 0;
async function loadPlace() {
  if (!pos) return;
  const my = ++placeRequest;
  const lat = pos.lat.toFixed(4), lon = pos.lon.toFixed(4);
  let name = "";
  try {
    const d = await getJson("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12&accept-language="
      + encodeURIComponent(LANGS[lang].geo) + "&lat=" + lat + "&lon=" + lon);
    const a = d.address || {};
    name = a.city || a.town || a.village || a.municipality || a.suburb || a.county || "";
  } catch (e) { /* weiter mit Fallback */ }
  if (!name) {
    try {
      const d = await getJson("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage="
        + encodeURIComponent(LANGS[lang].bdc) + "&latitude=" + lat + "&longitude=" + lon);
      name = d.city || d.locality || d.principalSubdivision || "";
    } catch (e) { /* ignorieren */ }
  }
  if (my !== placeRequest) return;   // inzwischen neuere Anfrage (z. B. Sprachwechsel)
  placeState = { text: name || lat + ", " + lon };
  renderPlace();
}

/* ------------------------------------------------------------------
   Wetter (Open-Meteo)
------------------------------------------------------------------ */
function wmoIcon(code, isDay) {
  if (code === 0 || code === 1) return isDay ? "☀️" : "🌙";
  if (code === 2) return isDay ? "⛅" : "☁️";
  if (code === 3) return "☁️";
  if (code === 45 || code === 48) return "🌫️";
  if (code >= 51 && code <= 57) return "🌦️";
  if (code >= 61 && code <= 67) return "🌧️";
  if (code >= 71 && code <= 77) return "🌨️";
  if (code >= 80 && code <= 82) return "🌦️";
  if (code === 85 || code === 86) return "🌨️";
  if (code >= 95) return "⛈️";
  return "🌡️";
}

let lastWx = null;

function renderWeather() {
  if (!lastWx) return;
  const c = lastWx;
  const L10 = LANGS[lang];
  const compass = L10.compass[Math.round(c.wind_direction_10m / 45) % 8];
  const mm = c.precipitation.toLocaleString(L10.locale, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  $("temp").textContent = Math.round(c.temperature_2m) + "°";
  $("icon").textContent = wmoIcon(c.weather_code, c.is_day === 1);
  $("desc").textContent = L10.wmo[c.weather_code] || LANGS[FALLBACK_LANG].wmo[c.weather_code] || "–";
  $("sFeel").textContent = Math.round(c.apparent_temperature) + "°";
  $("sWind").textContent = Math.round(c.wind_speed_10m) + " km/h " + compass;
  $("sHum").textContent = Math.round(c.relative_humidity_2m) + " %";
  $("sRain").textContent = mm + " mm";
}

async function loadWeather() {
  if (!pos) return;
  const params = new URLSearchParams({
    latitude: pos.lat.toFixed(4),
    longitude: pos.lon.toFixed(4),
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day",
    wind_speed_unit: "kmh",
    timezone: "auto"
  });
  try {
    const d = await getJson("https://api.open-meteo.com/v1/forecast?" + params);
    lastWx = d.current;
    renderWeather();
  } catch (e) {
    setStatus("weatherFail");
  }
}

/* ------------------------------------------------------------------
   Sprache anwenden
------------------------------------------------------------------ */
function applyLang() {
  document.documentElement.lang = lang === "pt-BR" ? "pt-BR" : lang;
  document.title = t("title");
  document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute("content", t("title"));
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-label]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nLabel)); });
  $("lang").value = lang;
  renderStatus();
  renderPlace();
  renderWeather();
  updateUi();
}

function setLang(code, persist) {
  if (!LANGS[code]) code = FALLBACK_LANG;
  lang = code;
  if (persist) saveLang(code);
  applyLang();
  if (pos) loadPlace();          // Ortsname in der neuen Sprache holen
}

$("lang").addEventListener("change", (e) => setLang(e.target.value, true));

/* ------------------------------------------------------------------
   Start
------------------------------------------------------------------ */
$("btnLocate").addEventListener("click", locate);
$("btnRefresh").addEventListener("click", () => {
  setStatus(null);
  loadRadar(true);
  loadWeather();
});

let lastRefresh = Date.now();
function autoRefresh() {
  lastRefresh = Date.now();
  loadRadar(false);
  loadWeather();
}
setInterval(autoRefresh, REFRESH_MS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - lastRefresh > REFRESH_MS) autoRefresh();
});

lang = savedLang() || detectLang();
applyLang();
loadRadar(true);
locate();
</script>
</body>
</html>
